<form [formGroup]="formGroup" class="ps-0 mt-4 d-flex flex-column">
  <fieldset class="rating rating-label">
    <!-- <legend>
    <span class="visually-hidden">Valutazione</span> <span>4 stelle</span>
    <span class="visually-hidden">su 5</span>
  </legend> -->
    <input
      type="radio"
      id="star5b"
      formControlName="rating"
      name="rating"
      value="5"
    />
    <label class="full" for="star5b">
      <svg class="icon icon-sm" aria-hidden="true">
        <use href="assets/sprites.svg#it-star-full"></use>
      </svg>
      <span class="visually-hidden">Valuta 5 stelle su 5</span>
    </label>
    <input
      type="radio"
      id="star4b"
      formControlName="rating"
      name="rating"
      value="4"
    />
    <label class="full" for="star4b">
      <svg class="icon icon-sm" aria-hidden="true">
        <use href="assets/sprites.svg#it-star-full"></use>
      </svg>
      <span class="visually-hidden">Valuta 4 stelle su 5</span>
    </label>
    <input
      type="radio"
      id="star3b"
      formControlName="rating"
      name="rating"
      value="3"
    />
    <label class="full" for="star3b">
      <svg class="icon icon-sm" aria-hidden="true">
        <use href="assets/sprites.svg#it-star-full"></use>
      </svg>
      <span class="visually-hidden">Valuta 3 stelle su 5</span>
    </label>
    <input
      type="radio"
      id="star2b"
      formControlName="rating"
      name="rating"
      value="2"
    />
    <label class="full" for="star2b">
      <svg class="icon icon-sm" aria-hidden="true">
        <use href="assets/sprites.svg#it-star-full"></use>
      </svg>
      <span class="visually-hidden">Valuta 2 stelle su 5</span>
    </label>
    <input
      type="radio"
      id="star1b"
      formControlName="rating"
      name="rating"
      value="1"
    />
    <label class="full" for="star1b">
      <svg class="icon icon-sm" aria-hidden="true">
        <use href="assets/sprites.svg#it-star-full"></use>
      </svg>
      <span class="visually-hidden">Valuta 1 stella su 5</span>
    </label>
  </fieldset>
  <div class="d-flex justify-content-center mt-3">
    <button class="btn btn-primary btn-xs" (click)="onSend()">Valuta</button>
  </div>
</form>
