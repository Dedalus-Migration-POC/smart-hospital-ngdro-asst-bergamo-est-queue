<div class="it-header-center-wrapper theme-light">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="it-header-center-content-wrapper">
          <div class="it-brand-wrapper">
            <a routerLink="/">
              <img
                src="assets/logo-vettoriale.webp"
                class="header-logo"
                alt=""
              />
            </a>
          </div>
          <div class="it-right-zone">
            <div class="it-socials d-none d-md-flex">
              <span>Seguici su</span>
              <ul
                class="list-inline text-left social it-socials"
                aria-label="Social"
              >
                <li class="list-inline-item" *ngFor="let social of socials">
                  <a
                    [href]="social.link"
                    target="_blank"
                    class="d-inline-block"
                  >
                    <svg class="icon">
                      <use
                        [attr.href]="
                          '/bootstrap-italia/dist/svg/sprites.svg#it-' +
                          social.icon
                        "
                      ></use>
                    </svg>
                    <span class="visually-hidden">{{ social.name }}</span>
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
